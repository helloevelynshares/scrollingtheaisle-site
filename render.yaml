# Render blueprint for the deterministic AisleCheck query API.
# Confirm before creating a paid/free service. Do not enable homepage liveApiEnabled
# until /health and sample POSTs are verified.

services:
  - type: web
    name: aislecheck-api
    runtime: docker
    dockerfilePath: ./services/aislecheck_api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: AISLECHECK_CORS_ORIGINS
        value: https://scrollingtheaisle.com,http://127.0.0.1:8000,http://localhost:8000
      - key: AISLECHECK_DEBUG_LOG
        value: "0"
      - key: AISLECHECK_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: AISLECHECK_MAX_QUERY_CHARS
        value: "500"
      - key: AISLECHECK_TIMEOUT_MS
        value: "8000"
