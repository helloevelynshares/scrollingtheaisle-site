# Durable human corrections / alias notes for product matching.
#
# READ-ONLY from the production weekly-ad matcher for now.
# The product_matching eval runner may load this file for reporting and
# future opt-in override experiments, but generate_weekly_ad_prices.py
# does NOT consult it.
#
# Schema per entry:
#   id: stable slug
#   family_id: canonical tracker family id
#   offer_text: retailer / flyer string (or baseline SKU name)
#   decision: accept | reject | manual_review
#   kind: alias | hard_negative | baseline_bug | note
#   source: where the correction came from
#   notes: free-text context
#   status: open | applied_in_yaml | deferred
#
# When you correct a live match:
# 1. Add/adjust YAML include or keep_separate_from if appropriate.
# 2. Append a row here documenting the decision.
# 3. Add a matching line to eval_cases.jsonl (see docs/product_matching.md).

schema_version: 1
