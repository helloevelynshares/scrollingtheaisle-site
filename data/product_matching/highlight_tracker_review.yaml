schema_version: 1
last_updated: '2026-07-25'
purpose: >
  Ambiguous Safeway video-transcript highlights that need human review before
  becoming canonical tracker families. Do not invent families from transcript
  text alone when the product was visual-only or ASR-garbled.
source_inventory: historical Safeway video transcripts (seed list Jul 2026)
coverage_audit: data/review/highlight_tracker_coverage_audit.yaml

items:
  - id: pork_cut_unclear
    proposed_product_or_family: pork (cut TBD) — possible spare ribs, loin chops, or country-style ribs
    source_week: transcript inventory (week TBD from source video)
    transcript_excerpt: pork highlighted without naming the cut
    possible_matching_source_rows:
      - Signature SELECT Pork Spareribs (see pork_spare_ribs_per_lb if that is the cut)
      - St. Louis Style Pork Ribs / back ribs
      - pork loin chops / country-style ribs in various weeks
    competing_interpretations:
      - Map to new pork_spare_ribs_per_lb if video showed spareribs
      - Separate loin-chop family if that was the highlight
      - Leave untracked if one-off prepared cut
    recommended_next_human_action: Open the source week PDF/screenshot and identify the exact cut before adding or linking a family.

